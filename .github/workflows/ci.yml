name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The harness is the gate that stops unsolvable lessons reaching a
      # learner: it validates every lesson against the schema and executes
      # every authored reference solution against its own grader.
      - name: Content harness
        run: npm run harness

      # The web build is how the course is distributed, and most of what can
      # break it is invisible to the unit tests: a preview origin that does
      # not reach the bundle, a missing Python runtime, two origins that are
      # really one. Building both shapes catches all three.
      - name: Static site builds (two origins)
        run: |
          APP_ORIGIN=https://conductor.example \
          PREVIEW_ORIGIN=https://preview.conductor.example \
          npm run build:web
          test -f out/web/app/index.html
          test -f out/web/preview/preview.html
          test ! -f out/web/app/preview.html
          grep -q "frame-ancestors https://conductor.example" out/web/preview/_headers

      - name: Static site builds (no preview origin)
        run: npm run build:web

      - name: Static site refuses one origin for both
        run: |
          if APP_ORIGIN=https://same.example PREVIEW_ORIGIN=https://same.example npm run build:web; then
            echo "build accepted a shared origin — the learner's code could reach the app"
            exit 1
          fi

      - name: Install sidecar dependencies
        run: |
          if [ -f services/mentor/requirements.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r services/mentor/requirements.txt
          else
            echo "sidecar not yet present (pre-Phase-4)"
          fi

      - name: Sidecar tests
        run: |
          if [ -d services/mentor/tests ]; then
            python -m pytest services/mentor -q
          else
            echo "sidecar tests not yet present (pre-Phase-4)"
          fi
